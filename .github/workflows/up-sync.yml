name: up-sync

# Sends merged translations back to the Dizzy site. On every merge here that
# changes a language or locales.json, it opens (or brings up to date) one
# pull request on the site's repository, branch `translations/up-sync`,
# carrying the language files, locales.json, each language's basis.json and
# the checksums the site uses to tell these files arrived untouched. That
# pull request is never merged automatically: a named person merging it is
# what publishes the words.
#
# The work is `tooling/up-sync.ts`, which the sync copies here; this file
# only checks the two repositories out, runs it, and opens the pull request.
# Only the site's catalogue folder is checked out, and nothing is printed
# from it.

on:
  push:
    branches: [main]
    paths:
      - "*/*.json"
      - locales.json
      - "!en-GB/**"
      - "!glossary/**"
      - "!tooling/**"
      - "!*/basis.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: up-sync
  cancel-in-progress: false

jobs:
  up-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: public
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install the tooling
        run: bun install --cwd public/tooling --no-save
      - id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.TRANSLATIONS_APP_ID }}
          private-key: ${{ secrets.TRANSLATIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: dizzy
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/dizzy
          token: ${{ steps.token.outputs.token }}
          path: site
          sparse-checkout: |
            packages/domain/messages
            packages/domain/src/i18n
      - name: Collect the pull requests this publishes
        working-directory: site
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PUBLIC_TOKEN: ${{ github.token }}
        run: |
          branch=translations/up-sync
          open=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          earlier=""
          if [ -n "$open" ]; then
            earlier=$(gh pr view "$open" --json body --jq .body | sed -n 's/.*<!-- translations-prs: \([0-9 ]*\) -->.*/\1/p' | head -n 1)
          fi
          merged=$(GH_TOKEN="$PUBLIC_TOKEN" gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(.user.type != "Bot") | .number] | map(tostring) | join(" ")')
          echo "OPEN=$open" >> "$GITHUB_ENV"
          echo "PRS=$earlier $merged" >> "$GITHUB_ENV"
      - name: Write the translations into the site's files
        run: >-
          bun public/tooling/up-sync.ts --from public --to site
          --prs "$PRS" --repo "${{ github.repository }}"
          --summary "$RUNNER_TEMP/body.md"
      - name: Open or update the pull request
        working-directory: site
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          branch=translations/up-sync
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish."
            if [ -n "$OPEN" ]; then
              gh pr close "$OPEN" --delete-branch --comment "Nothing left to publish: main already has all of this."
            fi
            exit 0
          fi
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          git -c user.name="${SLUG}[bot]" \
              -c user.email="${id}+${SLUG}[bot]@users.noreply.github.com" \
              commit -q -m "Translations from dizzy-translations"
          git push --force origin "HEAD:refs/heads/$branch"
          if [ -n "$OPEN" ]; then
            gh pr edit "$OPEN" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$branch" --base main \
              --title "Translations from dizzy-translations" \
              --body-file "$RUNNER_TEMP/body.md"
          fi

name: I want to translate a new language
description: Offer to translate Dizzy into a language it doesn't speak yet.
labels: ["new-language"]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: Brazilian Portuguese
    validations:
      required: true
  - type: dropdown
    id: reviewer
    attributes:
      label: Would you be its reviewer?
      description: The reviewer reads other people's changes in this language before they go in, and has the final say on its glossary.
      options:
        - "Yes"
        - "Maybe, once I've tried it"
        - "No, I'd just like to translate"
    validations:
      required: true
  - type: input
    id: community
    attributes:
      label: Which community are you in?
      description: The game you play and where, or the community on Dizzy you belong to. Nothing formal.
    validations:
      required: true
  - type: input
    id: register
    attributes:
      label: Formal or informal "you"?
      description: Which one the site should use to talk to the reader (tu or vous, du or Sie, você or tu). We suggest informal, because Dizzy talks to people casually.
      placeholder: Informal (você)
  - type: checkboxes
    id: read
    attributes:
      label: Before you send this
      options:
        - label: I've read CONTRIBUTING.md.
          required: true
